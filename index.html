<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Futbolini — Conducción de clubes chilenos</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/aero.css">

<body data-tema="aero">

<div id="fondo" aria-hidden="true">
  <div class="capa cielo"></div>
  <div class="capa aurora"></div>
  <div class="capa destello"></div>
  <div class="capa pasto"></div>
  <div class="capa burbujas" id="burbujas"></div>
</div>

<!-- ===== BARRA SUPERIOR ===== -->
<header id="barra">
  <div class="barra-brillo"></div>
  <div class="marca">
    <span class="glifo" id="escudo">⚽</span>
    <span class="nombre">FUTBOLINI</span>
    <span class="ver" id="verBadge" aria-label="Versión"></span>
  </div>
  <div class="barra-datos" id="barraDatos"></div>
  <div class="barra-acc">
    <button class="btn-aqua" id="btnAvanzar">Avanzar</button>
    <button class="btn-aqua chico" id="btnRapido" title="Avance rápido (delegar y simular)">⏩</button>
    <button class="btn-aqua chico" id="btnCuenta" title="Tu cuenta">👤</button>
    <button class="btn-aqua chico" id="btnAvisos" title="Avisos">🔔<span class="badge oculto" id="avisoBadge">0</span></button>
    <button class="btn-aqua chico" id="btnTemas" title="Cambiar tema">◐</button>
  </div>
</header>

<nav id="menu" role="tablist" aria-label="Secciones del club"></nav>

<main id="vista"></main>

<nav id="dock" class="oculto" aria-label="Navegación"></nav>

<footer id="pie">
  <span id="pieTxt">Futbolini · dramatización · Frutiger Aero</span>
  <span id="guardadoTxt">—</span>
</footer>

<div id="capa-modal"></div>
<div id="avisos"></div>
<button id="campanaAvisos" class="campana oculto" title="Avisos" aria-label="Avisos">🔔<span class="badge oculto" id="campanaBadge">0</span></button>
